name: Update json

on:
  workflow_dispatch:
    inputs:
      hotfix:
        description: "Hotfix"
        required: true
        type: choice
        default: "off"
        options:
          - "off"
          - "on"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    env:
      APK_HOTFIX: ${{ inputs.hotfix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Python dependencies
        run: |
          pip install requests

      - name: Update data
        run: |
          python updatejson.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add v2/latest_version.json
          git add v2/latest_version_md.json
          git commit -m "Auto Update Json" || echo "No changes to commit"

      - name: Push changes
        run: |
          git push
